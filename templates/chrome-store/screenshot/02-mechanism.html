<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Mechanism</title>
    <link rel="stylesheet" href="../../shared/tokens.css" />
    <link rel="stylesheet" href="../../shared/device.css" />
    <link rel="stylesheet" href="../../shared/layouts.css" />
    <link rel="stylesheet" href="../../shared/icons.css" />
    <style>
      body, .canvas { width: 1280px; height: 800px; }
      .headline { font-size: 64px; }
      .support { font-size: 20px; max-width: 420px; }
      .palette {
        position: absolute; left: 48px; right: 48px; top: 56px;
        background: #fff; border-radius: 12px; border: 1px solid #e4e8ec;
        box-shadow: 0 18px 40px rgba(16, 20, 24, 0.12); overflow: hidden;
      }
      .palette-search {
        height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 18px;
        border-bottom: 1px solid #eceff2; font-size: 15px; color: #101418; font-weight: 500;
      }
      .palette-search .ph { color: #5a6570; }
      .hit {
        display: grid; grid-template-columns: 1fr auto; gap: 8px;
        padding: 14px 18px; font-size: 14px; color: #5a6570;
        border-bottom: 1px solid #f1f3f5;
      }
      .hit.active { background: #d8f3e7; color: #101418; }
      .hit b { font-weight: 600; }
      .hit span { font-size: 12px; }
    </style>
  </head>
  <body>
    <div class="canvas field-atlas layout-split" data-beat="mechanism">
      <div class="copy">
        <div class="brand">Northline</div>
        <h1 class="headline">Type a few words. Jump there.</h1>
        <p class="support">Search titles, URLs, and recent context from one field.</p>
      </div>
      <div class="device-stage">
        <div class="browser">
          <div class="browser-chrome">
            <span class="browser-dot"></span><span class="browser-dot"></span><span class="browser-dot"></span>
            <div class="browser-omnibox">pricing research</div>
          </div>
          <div class="browser-body">
            <div class="palette">
              <div class="palette-search"><i class="ph ph-magnifying-glass" aria-hidden="true"></i> pricing</div>
              <div class="hit active"><b>Competitor pricing sheet</b><span>docs.google.com</span></div>
              <div class="hit"><b>Pricing page draft</b><span>northline.app</span></div>
              <div class="hit"><b>Research notes</b><span>notion.so</span></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
