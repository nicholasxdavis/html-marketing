<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Marquee</title>
    <link rel="stylesheet" href="../../shared/tokens.css" />
    <link rel="stylesheet" href="../../shared/device.css" />
    <link rel="stylesheet" href="../../shared/layouts.css" />
    <style>
      body, .canvas { width: 1400px; height: 560px; }
      .headline { font-size: 56px; }
      .support { font-size: 20px; max-width: 480px; }
      .palette {
        position: absolute; left: 36px; right: 36px; top: 40px;
        background: #fff; border-radius: 12px; border: 1px solid #e4e8ec; overflow: hidden;
      }
      .hit { padding: 14px 18px; font-size: 15px; color: #5a6570; border-bottom: 1px solid #f1f3f5; }
      .hit.active { background: #d8f3e7; color: #101418; font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="canvas field-atlas layout-marquee">
      <div class="copy">
        <div class="brand">Northline</div>
        <h1 class="headline">Your tabs, finally under control.</h1>
        <p class="support">A calm, fast way to search and switch without the mess.</p>
      </div>
      <div class="device-stage">
        <div class="browser">
          <div class="browser-chrome">
            <span class="browser-dot"></span><span class="browser-dot"></span><span class="browser-dot"></span>
            <div class="browser-omnibox">Search across open tabs</div>
          </div>
          <div class="browser-body">
            <div class="palette">
              <div class="hit">Search across open tabs</div>
              <div class="hit active">Pricing research - docs.google.com</div>
              <div class="hit">Design system - figma.com</div>
              <div class="hit">Weekly notes - notion.so</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
