<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Benefit</title>
    <link rel="stylesheet" href="../shared/tokens.css" />
    <link rel="stylesheet" href="../shared/device.css" />
    <link rel="stylesheet" href="../shared/layouts.css" />
    <style>
      body, .canvas { width: 1280px; height: 800px; }
      .headline { font-size: 56px; }
      .support { font-size: 20px; max-width: 420px; }
      .keys {
        position: absolute; left: 48px; right: 48px; top: 48px;
        display: flex; flex-direction: column; gap: 12px;
      }
      .row {
        background: #fff; border: 1px solid #e4e8ec; border-radius: 12px;
        padding: 18px 20px; display: flex; justify-content: space-between; align-items: center;
        font-size: 16px; font-weight: 600; color: #101418;
      }
      .row span { font-size: 13px; font-weight: 600; color: #0b6e4f; letter-spacing: 0.04em; }
    </style>
  </head>
  <body>
    <div class="canvas field-atlas layout-split" data-beat="benefit">
      <div class="copy">
        <div class="brand">Northline</div>
        <h1 class="headline">Everything you need, one shortcut away.</h1>
        <p class="support">Open, search, switch. Built for how you already browse.</p>
      </div>
      <div class="device-stage">
        <div class="browser">
          <div class="browser-chrome">
            <span class="browser-dot"></span><span class="browser-dot"></span><span class="browser-dot"></span>
            <div class="browser-omnibox">northline.app</div>
          </div>
          <div class="browser-body">
            <div class="keys">
              <div class="row">Open Northline <span>Ctrl K</span></div>
              <div class="row">Filter by domain <span>site:</span></div>
              <div class="row">Jump to match <span>Enter</span></div>
              <div class="row">Stay in the tab <span>Esc</span></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
