<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Hook</title>
    <link rel="stylesheet" href="../shared/tokens.css" />
    <link rel="stylesheet" href="../shared/device.css" />
    <link rel="stylesheet" href="../shared/layouts.css" />
    <style>
      body, .canvas { width: 1280px; height: 800px; }
      .headline { font-size: 64px; }
      .support { font-size: 20px; max-width: 420px; }
      .palette {
        position: absolute; left: 48px; right: 48px; top: 56px;
        background: #fff; border-radius: 12px; border: 1px solid #e4e8ec;
        box-shadow: 0 18px 40px rgba(16, 20, 24, 0.12); overflow: hidden;
      }
      .palette-search {
        height: 52px; display: flex; align-items: center; padding: 0 18px;
        border-bottom: 1px solid #eceff2; font-size: 15px; color: #101418; font-weight: 500;
      }
      .hit {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 18px; font-size: 14px; color: #5a6570;
      }
      .hit.active { background: #d8f3e7; color: #101418; font-weight: 600; }
      .hit .k { margin-left: auto; font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; color: #0b6e4f; }
    </style>
  </head>
  <body>
    <div class="canvas field-atlas layout-split" data-beat="hook">
      <div class="copy">
        <div class="brand">Northline</div>
        <h1 class="headline">Stop digging through tabs.</h1>
        <p class="support">Find the page you need in seconds, without the clutter.</p>
      </div>
      <div class="device-stage">
        <div class="browser">
          <div class="browser-chrome">
            <span class="browser-dot"></span><span class="browser-dot"></span><span class="browser-dot"></span>
            <div class="browser-omnibox">northline.app</div>
          </div>
          <div class="browser-body">
            <div class="palette">
              <div class="palette-search">pricing research</div>
              <div class="hit">Project brief - Q3</div>
              <div class="hit active">Pricing research <span class="k">Match</span></div>
              <div class="hit">Design references</div>
              <div class="hit">Customer notes</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
